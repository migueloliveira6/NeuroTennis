name: Daily Tennis Predictions

on:
  schedule:
    - cron: '00 22 * * *'  # Executa às 22h15 UTC diariamente

permissions:
  contents: write

jobs:
  generate-predictions:
    runs-on: ubuntu-latest

    env:
      TOKEN_BOT: ${{ secrets.TOKEN_BOT }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      MODEL_PATH: ${{ secrets.MODEL_PATH }}
      PREVISOES_PATH: ${{ vars.PREVISOES_PATH }}
      NAME_LOOKUP: ${{ vars.NAME_LOOKUP }}
      PREDICTIONS_JSON_URL: ${{ vars.PREDICTIONS_JSON_URL }}

    steps:
      - uses: actions/checkout@v3

      - name: Checkout gh-pages branch (analytics state)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-prev

      - name: Restore previous analytics JSONs
        run: |
          mkdir -p docs/analytics
          if [ -d "gh-pages-prev/analytics" ]; then
            cp -f gh-pages-prev/analytics/*.json docs/analytics/ 2>/dev/null || true
          elif [ -d "gh-pages-prev/docs/analytics" ]; then
            cp -f gh-pages-prev/docs/analytics/*.json docs/analytics/ 2>/dev/null || true
          fi

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run comparisons (prefer 2-day snapshot, fallback to yesterday)
        continue-on-error: true
        run: |
          YESTERDAY_UTC=$(date -u -d 'yesterday' +%F)
          TWO_DAYS_AGO_UTC=$(date -u -d '2 days ago' +%F)

          SNAPSHOT_PATH_2D="gh-pages-prev/predicts/history/predictions_${TWO_DAYS_AGO_UTC}.json"
          LEGACY_SNAPSHOT_PATH_2D="gh-pages-prev/docs/predicts/history/predictions_${TWO_DAYS_AGO_UTC}.json"
          SNAPSHOT_PATH="gh-pages-prev/predicts/history/predictions_${YESTERDAY_UTC}.json"
          LEGACY_SNAPSHOT_PATH="gh-pages-prev/docs/predicts/history/predictions_${YESTERDAY_UTC}.json"

          if [ -f "$SNAPSHOT_PATH_2D" ]; then
            echo "Usando snapshot de 2 dias atrás (mais provável para resultados de ontem): $SNAPSHOT_PATH_2D"
            python src/compare_predictions_results.py --pred-json-file "$SNAPSHOT_PATH_2D" --results-date "$YESTERDAY_UTC"
          elif [ -f "$LEGACY_SNAPSHOT_PATH_2D" ]; then
            echo "Usando snapshot legado de 2 dias atrás: $LEGACY_SNAPSHOT_PATH_2D"
            python src/compare_predictions_results.py --pred-json-file "$LEGACY_SNAPSHOT_PATH_2D" --results-date "$YESTERDAY_UTC"
          elif [ -f "$SNAPSHOT_PATH" ]; then
            echo "Usando snapshot de ontem: $SNAPSHOT_PATH"
            python src/compare_predictions_results.py --pred-json-file "$SNAPSHOT_PATH" --results-date "$YESTERDAY_UTC"
          elif [ -f "$LEGACY_SNAPSHOT_PATH" ]; then
            echo "Usando snapshot legado de ontem: $LEGACY_SNAPSHOT_PATH"
            python src/compare_predictions_results.py --pred-json-file "$LEGACY_SNAPSHOT_PATH" --results-date "$YESTERDAY_UTC"
          else
            echo "Snapshot de ontem não encontrado. Fallback para URL atual."
            python src/compare_predictions_results.py --pred-json-url "$PREDICTIONS_JSON_URL"
          fi

      - name: Run scraping
        run: python src/engine.py

      - name: Run predictions
        run: python src/generate_predictions.py

      - name: Generate analytics from latest comparison
        continue-on-error: true
        run: python src/generate_analytics.py

      - name: Create dated predictions snapshot
        run: |
          TODAY_UTC=$(date -u +%F)
          mkdir -p docs/predicts/history
          cp docs/predicts/predictions.json "docs/predicts/history/predictions_${TODAY_UTC}.json"
          echo "Snapshot criado: docs/predicts/history/predictions_${TODAY_UTC}.json"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          commit_message: "Atual previsões diárias"
