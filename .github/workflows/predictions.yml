name: Daily Tennis Predictions

on:
  schedule:
    - cron: '20 22 * * *'  # Executa às 22h15 UTC diariamente

permissions:
  contents: write

jobs:
  generate-predictions:
    runs-on: ubuntu-latest

    env:
      TOKEN_BOT: ${{ secrets.TOKEN_BOT }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      MODEL_PATH: ${{ secrets.MODEL_PATH }}
      PREVISOES_PATH: ${{ vars.PREVISOES_PATH }}
      NAME_LOOKUP: ${{ vars.NAME_LOOKUP }}
      PREDICTIONS_JSON_URL: ${{ vars.PREDICTIONS_JSON_URL }}

    steps:
      - uses: actions/checkout@v3

      - name: Checkout gh-pages branch (analytics state)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-prev

      - name: Restore previous analytics JSONs
        run: |
          mkdir -p docs/analytics
          if [ -d "gh-pages-prev/analytics" ]; then
            cp -f gh-pages-prev/analytics/*.json docs/analytics/ 2>/dev/null || true
          elif [ -d "gh-pages-prev/docs/analytics" ]; then
            cp -f gh-pages-prev/docs/analytics/*.json docs/analytics/ 2>/dev/null || true
          fi

      - name: Restore previous predictions history
        run: |
          mkdir -p docs/predicts/history
          if [ -d "gh-pages-prev/predicts/history" ]; then
            cp -Rf gh-pages-prev/predicts/history/. docs/predicts/history/ 2>/dev/null || true
          elif [ -d "gh-pages-prev/docs/predicts/history" ]; then
            cp -Rf gh-pages-prev/docs/predicts/history/. docs/predicts/history/ 2>/dev/null || true
          fi

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run comparisons (use yesterday snapshot)
        continue-on-error: true
        run: |
          YESTERDAY_UTC=$(date -u -d 'yesterday' +%F)

          echo "========================================"
          echo " Comparação de Previsões vs Resultados"
          echo "========================================"
          echo " Resultados da data: $YESTERDAY_UTC"
          echo " Snapshot esperado:  predictions_${YESTERDAY_UTC}.json"
          echo ""

          SNAPSHOT_PATH="gh-pages-prev/predicts/history/predictions_${YESTERDAY_UTC}.json"
          LEGACY_SNAPSHOT_PATH="gh-pages-prev/docs/predicts/history/predictions_${YESTERDAY_UTC}.json"

          echo " Snapshots disponíveis:"
          ls -1 gh-pages-prev/predicts/history/predictions_*.json 2>/dev/null | head -5 || echo "   (nenhum encontrado)"
          echo ""

          if [ -f "$SNAPSHOT_PATH" ]; then
            echo "✅ Snapshot encontrado em: $SNAPSHOT_PATH"
            echo "🚀 Executando compare com snapshot oficial de $YESTERDAY_UTC..."
            python src/compare_predictions_results.py --pred-json-file "$SNAPSHOT_PATH" --results-date "$YESTERDAY_UTC"
          elif [ -f "$LEGACY_SNAPSHOT_PATH" ]; then
            echo "✅ Snapshot encontrado em (legado): $LEGACY_SNAPSHOT_PATH"
            echo " Executando compare com snapshot legado de $YESTERDAY_UTC..."
            python src/compare_predictions_results.py --pred-json-file "$LEGACY_SNAPSHOT_PATH" --results-date "$YESTERDAY_UTC"
          else
            echo "⚠️  Snapshot de $YESTERDAY_UTC não encontrado."
            echo " Fallback: Usando URL predictions.json atual com results-date=$YESTERDAY_UTC..."
            python src/compare_predictions_results.py --pred-json-url "$PREDICTIONS_JSON_URL" --results-date "$YESTERDAY_UTC"
          fi
          echo " Comparação concluída"

      - name: Run scraping
        run: python src/engine.py

      - name: Run predictions
        run: python src/generate_predictions.py

      - name: Generate analytics from latest comparison
        continue-on-error: true
        run: python src/generate_analytics.py

      - name: Create dated predictions snapshot
        run: |
          echo ""
          echo "========================================"
          echo " Guardando Snapshot de Previsões"
          echo "========================================"
          
          PREV_PATH="${PREVISOES_PATH%/}"
          LATEST_PRED_CSV=$(find "$PREV_PATH" -maxdepth 1 -type f -name 'previsoes_tenis_*.csv' | sort | tail -n1)

          if [ -n "$LATEST_PRED_CSV" ] && [[ "$(basename "$LATEST_PRED_CSV")" =~ previsoes_tenis_([0-9]{4}-[0-9]{2}-[0-9]{2})\.csv ]]; then
            SNAPSHOT_DATE="${BASH_REMATCH[1]}"
            echo " Data extraída do CSV: $(basename "$LATEST_PRED_CSV")"
            echo " Snapshot será salvo como: predictions_${SNAPSHOT_DATE}.json"
          else
            SNAPSHOT_DATE=$(date -u +%F)
            echo "⚠️  CSV de previsões não encontrado com padrão esperado."
            echo " Fallback: Usando UTC de hoje como data: $SNAPSHOT_DATE"
          fi

          mkdir -p docs/predicts/history
          cp docs/predicts/predictions.json "docs/predicts/history/predictions_${SNAPSHOT_DATE}.json"
          echo "✅ Snapshot salvo: docs/predicts/history/predictions_${SNAPSHOT_DATE}.json"
          echo "   (Este snapshot será usado no compare de amanhã)"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          commit_message: "Atual previsões diárias"
