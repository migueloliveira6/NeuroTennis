name: Daily Tennis Predictions

on:
  schedule:
    - cron: '30 22 * * *'  # Executa às 22h30 UTC diariamente

permissions:
  contents: write

jobs:
  generate-predictions:
    runs-on: ubuntu-latest

    env:
      TOKEN_BOT: ${{ secrets.TOKEN_BOT }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      MODEL_PATH: ${{ secrets.MODEL_PATH }}
      PREVISOES_PATH: ${{ vars.PREVISOES_PATH }}
      NAME_LOOKUP: ${{ vars.NAME_LOOKUP }}

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run comparisons (compare_predictions_results)
        run: python src/compare_predictions_results.py

      - name: Run scraping
        run: python src/bot_telegram_git.py

      - name: Run predictions
        run: python src/generate_predictions.py

      - name: Compare predictions with results
        continue-on-error: true
        run: python src/compare_predictions_results.py

      - name: Send comparison via bot
        continue-on-error: true
        run: python src/bot_telegram_git.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          commit_message: "Atual previsões diárias"
